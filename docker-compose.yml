name: scattershot

services:
  db:
    image: pgvector/pgvector:pg16
    environment: 
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/prosgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_istready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    
  
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    volumes: ["./backend:/srv"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    volumes: ["./backend:/srv"]
    depends_on:
      db: {condition: service_healthy}
  
  frontend:
    build: ./frontend
    command: bun run dev --host 0.0.0.0
    volumes:
      - ./frontend:/srv
      - //srv/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]
  

volumes:
  pgdata:
      